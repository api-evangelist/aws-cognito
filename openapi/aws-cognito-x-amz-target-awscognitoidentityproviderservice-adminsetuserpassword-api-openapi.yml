components:
  schemas:
    ResourceNotFoundException: {}
    AdminSetUserPasswordRequest:
      type: object
      required:
      - UserPoolId
      - Username
      - Password
      title: AdminSetUserPasswordRequest
      properties:
        UserPoolId:
          allOf:
          - $ref: '#/components/schemas/UserPoolIdType'
          - description: The user pool ID for the user pool where you want to set the user's password.
        Username:
          allOf:
          - $ref: '#/components/schemas/UsernameType'
          - description: The user name of the user whose password you want to set.
        Password:
          allOf:
          - $ref: '#/components/schemas/PasswordType'
          - description: The password for the user.
        Permanent:
          allOf:
          - $ref: '#/components/schemas/BooleanType'
          - description: ' <code>True</code> if the password is permanent, <code>False</code> if it is temporary.'
    UserPoolIdType:
      type: string
      pattern: '[\w-]+_[0-9a-zA-Z]+'
      minLength: 1
      maxLength: 55
    BooleanType:
      type: boolean
    InvalidPasswordException: {}
    NotAuthorizedException: {}
    UsernameType:
      type: string
      pattern: '[\p{L}\p{M}\p{S}\p{N}\p{P}]+'
      minLength: 1
      maxLength: 128
      format: password
    UserNotFoundException: {}
    TooManyRequestsException: {}
    AdminSetUserPasswordResponse:
      type: object
      properties: {}
    PasswordType:
      type: string
      pattern: '[\S]+'
      maxLength: 256
      format: password
    InvalidParameterException: {}
    InternalErrorException: {}
